# Django migrations are auto-generated; keep them out of all hooks
exclude: ^backend/.*/migrations/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  # GitHub config files: validate against their JSON schemas
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-dependabot
      - id: check-github-workflows

  # Backend (configs live in backend/, hooks run from the repo root)
  - repo: https://github.com/PyCQA/isort
    rev: 9.0.2
    hooks:
      - id: isort
        args: [--settings-path=backend]
        files: ^backend/

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        args: [--config=backend/pyproject.toml]
        files: ^backend/

  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        args: [--config=backend/.flake8]
        additional_dependencies: [flake8-quotes==3.4.0]
        files: ^backend/

  # Frontend (requires `npm install` in frontend/)
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
